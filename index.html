<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F6C945" />
  <meta name="description" content="法语入门每日一课：每天30词+10短句+5长句，语音朗读，打卡续学" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>法语入门每日一课</title>
  <style>
    :root {
      /* 柠檬黄 + 淡粉色 主题色板 */
      --lemon: #f6c945;          /* 柠檬黄主色 */
      --lemon-bright: #ffd94d;   /* 亮柠檬黄 */
      --lemon-soft: #fff3d6;     /* 柠檬黄浅底 */
      --lemon-deep: #e0a800;     /* 深柠檬黄（文字强调） */
      --pink: #ffd9e3;           /* 淡粉主色 */
      --pink-soft: #fff0f4;      /* 淡粉浅底 */
      --pink-deep: #e86a8a;      /* 深粉（强调） */
      --green: #3cbf6e;
      --text: #3d3226;           /* 暖棕色文字 */
      --muted: #9a8a72;          /* 柔和棕灰 */
      --bg: #fff8ec;             /* 柠檬黄奶油背景 */
      --card: #ffffff;
      --radius: 20px;
      --shadow: rgba(246,201,69,.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      max-width: 520px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #f6c945 0%, #ffd94d 45%, #ffd9e3 100%);
      color: #5b4a1e;
      padding: 18px 20px 58px;
      border-radius: 0 0 26px 26px;
      box-shadow: 0 6px 18px rgba(246,201,69,.35);
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .app-title { font-size: 17px; font-weight: 800; letter-spacing: .5px; }
    .streak-badge {
      background: rgba(255,255,255,.55);
      color: #8a6d00;
      border-radius: 999px; padding: 6px 12px;
      font-size: 13px; font-weight: 700; white-space: nowrap;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
    }
    .header-tools { display: flex; align-items: center; gap: 8px; }
    .rate-btn {
      background: rgba(255,255,255,.55);
      color: #8a6d00;
      border: none; border-radius: 999px;
      padding: 6px 12px; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
      transition: background .2s, color .2s;
    }
    .rate-btn.active { background: var(--pink-deep); color: #fff; }
    .today-line { margin-top: 14px; font-size: 14px; opacity: .8; font-weight: 600; }
    .today-word { margin-top: 2px; font-size: 24px; font-weight: 800; letter-spacing: 1px; color: #6b5200; }

    main { flex: 1; padding: 16px 16px 20px; margin-top: -34px; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 6px 20px var(--shadow);
      padding: 18px; margin-bottom: 14px;
      border: 1px solid #ffeec2;
    }
    /* 相间：偶数字卡用淡粉底 */
    .card:nth-child(even) {
      background: linear-gradient(180deg, #fff 0%, var(--pink-soft) 100%);
    }
    .card h2 {
      font-size: 15px; color: var(--lemon-deep); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
      font-weight: 800;
    }
    .card h2 .num {
      background: linear-gradient(135deg, var(--lemon-bright), var(--pink-deep));
      color: #fff;
      width: 22px; height: 22px; border-radius: 7px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
    }
    .lesson-meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

    /* 分组标题 */
    .sec-title {
      font-size: 14px; font-weight: 800; color: var(--lemon-deep);
      margin: 14px 0 8px; display: flex; align-items: center; gap: 6px;
    }
    .sec-title .tag {
      background: var(--lemon-soft); color: var(--lemon-deep);
      font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 99px;
    }

    /* 单词表 */
    .word-list { list-style: none; }
    .word-list li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 2px; border-bottom: 1px dashed #ffe9c4; font-size: 15px;
      gap: 8px;
    }
    .word-list li:last-child { border-bottom: none; }
    .word-list .w-fr { font-weight: 700; color: #8a6d00; }
    .word-list .w-zh { color: var(--muted); font-size: 13px; flex-shrink: 0; }

    /* 句子（淡粉） */
    .sentence {
      background: linear-gradient(135deg, var(--pink-soft), #fff);
      border-left: 4px solid var(--pink-deep);
      border-radius: 12px;
      padding: 10px 12px; margin: 6px 0 10px;
    }
    .sentence .fr { font-size: 17px; font-weight: 700; color: var(--pink-deep); }
    .sentence .zh { font-size: 14px; color: #8a6d5a; margin-top: 2px; }

    /* 长句（柠檬黄） */
    .long-sentence {
      background: linear-gradient(135deg, var(--lemon-soft), #fff);
      border-radius: 14px;
      padding: 12px 14px; margin: 8px 0;
      border: 1px solid #ffe7a8;
    }
    .long-sentence .fr { font-size: 15px; font-weight: 700; color: #a17a00; line-height: 1.6; }
    .long-sentence .zh { font-size: 14px; color: #8a6d5a; margin-top: 4px; line-height: 1.6; }

    /* 朗读按钮 */
    .speak-btn {
      background: transparent; border: none; cursor: pointer;
      color: var(--lemon-deep); font-size: 13px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px; border-radius: 8px;
    }
    .speak-btn:hover { background: rgba(246,201,69,.15); }
    .speak-btn.small { font-size: 12px; padding: 3px 6px; }
    .speak-btn.playing { color: var(--pink-deep); }

    /* 播放全部 */
    .play-all {
      background: linear-gradient(135deg, var(--lemon-bright), var(--pink-deep));
      color: #fff;
      border: none; border-radius: 12px;
      padding: 10px 16px; font-size: 14px; font-weight: 800;
      cursor: pointer; margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(232,106,138,.25);
    }
    .play-all:active { transform: scale(.98); }

    .btn {
      width: 100%; border: none; border-radius: 16px;
      padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer;
      transition: transform .08s, opacity .2s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--lemon-bright) 0%, var(--pink-deep) 100%);
      color: #fff;
      box-shadow: 0 6px 16px rgba(246,201,69,.4);
    }
    .btn-done { background: linear-gradient(135deg, #5dd0a0, #3c9d6a); color: #fff; }
    .btn-ghost { background: var(--lemon-soft); color: var(--lemon-deep); }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }

    .checked-in { text-align: center; padding: 28px 10px; }
    .check-circle {
      width: 74px; height: 74px; border-radius: 50%;
      background: linear-gradient(135deg, #ffd94d, #f6c945);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px; font-size: 40px;
      box-shadow: 0 8px 20px rgba(246,201,69,.45);
    }
    .checked-in .tip { color: var(--muted); font-size: 14px; margin-top: 8px; }

    .progress-bar {
      height: 10px; border-radius: 99px;
      background: #ffe9c4; overflow: hidden; margin-top: 12px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--lemon-bright), var(--pink-deep));
      border-radius: 99px; transition: width .4s;
    }

    .info-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }

    .install-banner {
      background: linear-gradient(90deg,#f6c945,#ffd9e3); color:#6b5200;
      border-radius: 16px; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 14px; font-size: 14px; font-weight: 600;
      border: 1px solid #ffe7a8;
    }
    .install-banner button {
      background:#fff; color: var(--pink-deep); border:none; border-radius: 10px;
      padding: 8px 14px; font-weight:800; cursor:pointer; flex-shrink: 0;
    }
    .hidden { display: none !important; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 6px 0 16px; }
    .divider { border: none; border-top: 1px solid #ffe9c4; margin: 14px 0; }

    /* 文章 */
    .article-title { font-size: 19px; font-weight: 800; color: var(--lemon-deep); margin-bottom: 6px; }
    .article-level { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .article-para {
      background: linear-gradient(135deg, var(--pink-soft), #fff);
      border-radius: 12px;
      padding: 10px 12px; margin: 8px 0; border-left: 3px solid var(--pink-deep);
    }
    .article-para .fr { font-size: 15px; font-weight: 700; color: #a17a00; line-height: 1.6; }
    .article-para .zh { font-size: 13px; color: #8a6d5a; margin-top: 3px; }
    .lesson-chip {
      display: inline-block; background: var(--lemon-soft); color: var(--lemon-deep);
      border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700;
      margin: 4px 6px 4px 0;
    }
    .stage-note {
      background: var(--lemon-soft); border: 1px solid #ffe7a8; color: #a17a00;
      border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <span class="app-title">🇫🇷 法语入门 · 每日一课</span>
      <div class="header-tools">
        <button class="rate-btn" id="rateBtn" onclick="toggleRate()" title="切换朗读速度">🐢 慢速</button>
        <span class="streak-badge">🔥 连续 <span id="streak">0</span> 天</span>
      </div>
    </div>
    <div class="today-line" id="todayLine">正在加载今日课程…</div>
    <div class="today-word" id="todayWord"></div>
  </header>

  <main>
    <div class="install-banner hidden" id="installBanner">
      <span>📱 安装到手机桌面，随时学习</span>
      <button id="installBtn">安装</button>
    </div>

    <div class="card" id="lessonCard"></div>

    <div class="card">
      <h2>📚 学习进度</h2>
      <div class="info-row">
        <span>已完成 <b id="doneCount">0</b> 课</span>
        <span>今日学习 <b id="learnMinutes">0</b> 分钟</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="info-row" id="syncRow" style="margin-top:12px;align-items:center">
        <span id="syncStatus">☁️ 云端同步</span>
        <button class="speak-btn small" id="syncBtn" onclick="onSyncBtnClick()">配置</button>
      </div>
    </div>

    <div class="card">
      <h2>🔔 每日提醒</h2>
      <p style="font-size:14px;color:var(--muted);margin-bottom:10px">开启通知，每天自动收到新课程提醒，不错过打卡。</p>
      <button class="btn btn-ghost" id="notifyBtn">开启每日提醒</button>
    </div>

    <div class="card" id="historyCard">
      <h2>🕘 历史回看</h2>
      <p style="font-size:14px;color:var(--muted);margin-bottom:10px">回顾你打卡过、学过的课程。</p>
      <div id="historyList"></div>
    </div>

    <footer>Bon courage ! 坚持每天一课，法语轻松入门</footer>
  </main>

  <script src="data.js"></script>
  <script>
    /* ================= 工具函数 ================= */
    const LS = window.localStorage;
    const pad = (n) => String(n).padStart(2,'0');
    const dateStr = (d) => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
    const todayStr = () => dateStr(new Date());
    const load = (key, def) => { try { const v = LS.getItem(key); return v ? JSON.parse(v) : def; } catch(e){ return def; } };
    const save = (key, val) => LS.setItem(key, JSON.stringify(val));

    /* ================= 状态 =================
     * state.checkins : { "YYYY-MM-DD": 内容索引 }
     * state.target   : 当前应学内容索引（打卡后 +1，未打卡保持不变 → 重复推荐）
     * state.streak   : 连续打卡天数
     * 内容索引映射：
     *   0 .. COURSES.length-1         → 基础课程
     *   COURSES.length .. +ARTICLES   → 简短文章（学完基础课程后进入）
     */
    const STATE_KEY = 'francais_state_v2';
    let state = load(STATE_KEY, { checkins: {}, target: 0, streak: 0 });
    const TOTAL_CONTENT = window.COURSES.length + window.ARTICLES.length;

    /* 获取当前目标内容对象 */
    function getContentByIndex(idx) {
      idx = idx % TOTAL_CONTENT;
      if (idx < window.COURSES.length) {
        return { type: 'course', idx, data: window.COURSES[idx] };
      }
      const aIdx = idx - window.COURSES.length;
      return { type: 'article', idx, data: window.ARTICLES[aIdx] };
    }

    function getTodayContent() {
      const today = todayStr();
      if (state.checkins[today] !== undefined) {
        const idx = state.checkins[today];
        const c = getContentByIndex(idx);
        return { ...c, checkedIn: true };
      }
      const c = getContentByIndex(state.target);
      return { ...c, checkedIn: false };
    }

    /* ================= 语音朗读（双引擎：本地 TTS + 在线发音降级） =================
     * 引擎 1：浏览器内置 Web Speech API（离线可用，Chrome/Safari/Edge 支持）
     * 引擎 2：在线真人发音（有道词典接口，国内可访问，任何浏览器都能播）
     * 自动选择：有本地法语语音 → 引擎1；没有（如华为/微信内置浏览器）→ 引擎2
     */
    const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
    let frVoice = null;
    let voicesReady = !!(synth && synth.getVoices && synth.getVoices().length);

    /* 朗读速度：正常 0.85 / 慢速 0.6（初学者跟着读） */
    const RATE_KEY = 'francais_rate_slow';
    const RATE_NORMAL = 0.85;
    const RATE_SLOW = 0.6;
    let isSlow = load(RATE_KEY, false);
    function currentRate() { return isSlow ? RATE_SLOW : RATE_NORMAL; }

    /* 切换慢速/正常朗读，并同步按钮状态 */
    function toggleRate() {
      isSlow = !isSlow;
      save(RATE_KEY, isSlow);
      updateRateBtn();
    }
    function updateRateBtn() {
      const btn = document.getElementById('rateBtn');
      if (!btn) return;
      btn.textContent = isSlow ? '🐢 慢速' : '🐇 正常';
      btn.classList.toggle('active', isSlow);
    }

    function pickFrenchVoice() {
      if (!synth) return null;
      const voices = synth.getVoices() || [];
      // 优先 fr-FR，其次任何法语
      frVoice = voices.find(v => /^fr[-_]FR/i.test(v.lang)) ||
                voices.find(v => /^fr/i.test(v.lang)) || null;
      if (frVoice) voicesReady = true;
      return frVoice;
    }
    if (synth) {
      pickFrenchVoice();
      if (typeof synth.onvoiceschanged !== 'undefined') {
        synth.onvoiceschanged = pickFrenchVoice;
      }
      // 部分浏览器 voices 异步加载，预留 1.5 秒再检测一次
      setTimeout(pickFrenchVoice, 1500);
    }

    /* 是否可用本地引擎（有接口且找到法语语音） */
    function canUseLocalTTS() {
      return !!(synth && (frVoice || voicesReady));
    }

    /* 引擎 2：在线发音（有道词典公开接口，支持法语，需联网） */
    let currentAudio = null;
    function audioFallback(text, onEnd, onError) {
      try {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=0';
        const audio = new Audio();
        audio.src = url;
        currentAudio = audio;
        audio.onended = () => { currentAudio = null; if (onEnd) onEnd(); };
        audio.onerror = () => { currentAudio = null; if (onError) onError(); };
        audio.play().catch(() => { if (onError) onError(); });
      } catch (e) {
        if (onError) onError();
      }
    }

    /* 单句朗读（自动选引擎） */
    function speak(text, rate) {
      if (canUseLocalTTS()) {
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR';
        if (frVoice) u.voice = frVoice;
        u.rate = rate || currentRate();  // 跟随慢速/正常设置
        u.pitch = 1;
        synth.speak(u);
      } else {
        // 降级：在线发音（需联网）
        audioFallback(text, null, () => {
          alert('朗读失败：在线发音需要联网。请检查网络，或改用 Chrome / Safari / Edge 打开本应用可获得离线朗读。');
        });
      }
    }

    /* 播放整段（队列朗读，自动选引擎，再次点击可停止） */
    let playQueue = [];
    let isPlaying = false;
    function playAll(items, rate) {
      if (isPlaying) {
        // 停止
        if (synth) synth.cancel();
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        isPlaying = false;
        return;
      }
      playQueue = items.map(i => i.fr);
      isPlaying = true;
      const useLocal = canUseLocalTTS();

      const speakNext = () => {
        if (!isPlaying || playQueue.length === 0) { isPlaying = false; return; }
        const txt = playQueue.shift();

        if (useLocal) {
          const u = new SpeechSynthesisUtterance(txt);
          u.lang = 'fr-FR';
          if (frVoice) u.voice = frVoice;
          u.rate = rate || currentRate();
          u.onend = () => setTimeout(speakNext, 400);
          u.onerror = () => { isPlaying = false; };
          synth.speak(u);
        } else {
          audioFallback(txt,
            () => setTimeout(speakNext, 400),
            () => {
              isPlaying = false;
              alert('连续朗读已停止：在线发音需要联网。请检查网络，或改用 Chrome / Safari / Edge 打开本应用。');
            });
        }
      };
      speakNext();
    }

    /* ================= 打卡 ================= */
    function checkIn() {
      const today = todayStr();
      if (state.checkins[today] !== undefined) return; // 防重复
      state.checkins[today] = state.target;
      state.target = (state.target + 1) % TOTAL_CONTENT;
      // 连续天数
      const y = new Date(); y.setDate(y.getDate() - 1);
      const yesterdayStr = dateStr(y);
      state.streak = (state.checkins[yesterdayStr] !== undefined) ? (state.streak + 1) : 1;
      save(STATE_KEY, state);
      render();
      syncAfterCheckIn();
      try {
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('打卡成功！✓', { body: '明天继续来学新内容吧～' });
        }
      } catch(e){}
    }

    /* ================= 渲染 ================= */
    // viewingHistory 不为 null 时，主卡片显示该日期的历史内容
    let viewingHistoryDate = null;

    function render() {
      const today = todayStr();
      const doneCount = Object.keys(state.checkins).length;
      const progress = Math.min(100, Math.round(doneCount / TOTAL_CONTENT * 100));
      const learnedMin = load('minutes_' + today, 0);

      document.getElementById('streak').textContent = state.streak;
      document.getElementById('doneCount').textContent = doneCount;
      document.getElementById('learnMinutes').textContent = learnedMin;
      document.getElementById('progressFill').style.width = progress + '%';
      updateRateBtn();

      const card = document.getElementById('lessonCard');
      let html = '';

      // 历史回看模式
      if (viewingHistoryDate && state.checkins[viewingHistoryDate] !== undefined) {
        const idx = state.checkins[viewingHistoryDate];
        const c = getContentByIndex(idx);
        document.getElementById('todayWord').textContent = '🕘 历史回看';
        document.getElementById('todayLine').textContent = `${viewingHistoryDate} 的课程`;
        html += `<div style="margin-bottom:12px">
                   <button class="btn btn-ghost" onclick="backToToday()">← 返回今日课程</button>
                 </div>`;
        if (c.type === 'course') html += renderCourse({ ...c, checkedIn: true });
        else html += renderArticle({ ...c, checkedIn: true });
      } else {
        const content = getTodayContent();
        document.getElementById('todayWord').textContent = content.type === 'course' ? content.data.title : '📰 今日阅读';
        document.getElementById('todayLine').textContent = `今天是 ${today} · ${content.checkedIn ? '已完成' : '待打卡'}`;
        if (content.type === 'course') {
          html += renderCourse(content);
        } else {
          html += renderArticle(content);
        }
      }

      card.innerHTML = html;
      renderHistory();
    }

    /* 渲染历史回看列表 */
    function renderHistory() {
      const list = document.getElementById('historyList');
      if (!list) return;
      const dates = Object.keys(state.checkins).sort().reverse();
      if (dates.length === 0) {
        list.innerHTML = '<p style="font-size:13px;color:var(--muted)">还没有打卡记录，先去学今天的课程吧～</p>';
        return;
      }
      let h = '';
      dates.forEach(d => {
        const c = getContentByIndex(state.checkins[d]);
        const label = c.type === 'course' ? `第${c.data.day}课 · ${c.data.title}` : `📰 ${c.data.title}`;
        const active = viewingHistoryDate === d;
        h += `<div class="history-item" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dashed #ffe9c4">
                <span style="font-size:13px;color:var(--muted)">${d}</span>
                <span style="font-size:14px;font-weight:700;color:var(--lemon-deep)">${label}</span>
                <button class="speak-btn small" onclick="viewHistory('${d}')">${active ? '查看中' : '回看'}</button>
              </div>`;
      });
      list.innerHTML = h;
    }

    /* 查看某天历史 */
    function viewHistory(date) {
      viewingHistoryDate = date;
      render();
      window.scrollTo(0, 0);
    }

    /* 返回今日 */
    function backToToday() {
      viewingHistoryDate = null;
      render();
      window.scrollTo(0, 0);
    }

    /* 渲染课程 */
    function renderCourse(content) {
      const c = content.data;
      let h = `
        <h2>📖 第 ${c.day} 课 · ${c.title}</h2>
        <div class="lesson-meta">🎯 学习重点：${c.focus}　·　30词 / 10短句 / 5长句</div>
      `;
      // 已打卡：内容仍完整显示，在末尾追加打卡成功提示

      // 单词
      h += `<div class="sec-title">📌 今日词汇 <span class="tag">${c.words.length} 词</span>
              <button class="speak-btn" onclick="playWords()">🔊 全部朗读</button></div>`;
      h += `<ul class="word-list">`;
      c.words.forEach((w, i) => {
        h += `<li><span class="w-fr">${w[0]}</span>
                <span style="display:inline-flex;align-items:center;gap:6px">
                  <span class="w-zh">${w[1]}</span>
                  <button class="speak-btn small" onclick="speak('${esc(w[0])}')">🔊</button>
                </span></li>`;
      });
      h += `</ul>`;

      // 短句
      h += `<div class="sec-title">💬 实用短句 <span class="tag">${c.shorts.length} 句</span>
              <button class="speak-btn" onclick="playShortSentences()">🔊 全部朗读</button></div>`;
      c.shorts.forEach(s => {
        h += `<div class="sentence">
                <div class="fr">${s[0]} <button class="speak-btn small" onclick="speak('${esc(s[0])}')">🔊</button></div>
                <div class="zh">${s[1]}</div>
              </div>`;
      });

      // 长句
      h += `<div class="sec-title">📝 5 个长句 <span class="tag">挑战</span>
              <button class="speak-btn small" onclick="speakLongSentences()">🔊 全部朗读</button></div>`;
      c.longs.forEach(l => {
        h += `<div class="long-sentence">
                <div class="fr">${l[0]} <button class="speak-btn small" onclick="speak('${esc(l[0])}')">🔊</button></div>
                <div class="zh">${l[1]}</div>
              </div>`;
      });

      if (content.checkedIn) {
        h += `
          <hr class="divider" />
          <div class="checked-in">
            <div class="check-circle">✓</div>
            <div style="font-weight:700;font-size:18px;color:var(--green)">今日打卡成功！</div>
            <div class="tip">明天记得回来学新内容哦～</div>
          </div>
        `;
      } else {
        h += `
          <hr class="divider" />
          <p style="font-size:13px;color:var(--muted);margin-bottom:12px">学完上面的内容（先跟读单词，再读短句和长句），点击打卡完成今日学习。</p>
          <button class="btn btn-primary" onclick="checkIn()">✅ 我已学完，今日打卡</button>
        `;
      }
      return h;
    }

    /* 渲染文章 */
    function renderArticle(content) {
      const a = content.data;
      let h = `
        <h2>📰 每日短文 · 阅读阶段</h2>
        <div class="stage-note">🎉 恭喜！你已经完成基础课程，进入<b>短文阅读</b>阶段。每天一篇 A1-A2 难度短文，学习地道表达。</div>
        <div class="article-title">${a.title}</div>
        <div class="article-level">难度：A1-A2 · 带逐句翻译与朗读</div>
      `;
      h += `<button class="play-all" onclick="playAll(${JSON.stringify(a.paras.map(p=>({fr:p.fr})))},currentRate())">🔊 播放全文</button>`;
      a.paras.forEach(p => {
        h += `<div class="article-para">
                <div class="fr">${p.fr} <button class="speak-btn small" onclick="speak('${esc(p.fr)}')">🔊</button></div>
                <div class="zh">${p.zh}</div>
              </div>`;
      });

      if (content.checkedIn) {
        h += `
          <hr class="divider" />
          <div class="checked-in">
            <div class="check-circle">✓</div>
            <div style="font-weight:700;font-size:18px;color:var(--green)">今日阅读打卡成功！</div>
            <div class="tip">明天继续下一篇哦～</div>
          </div>
        `;
      } else {
        h += `
          <hr class="divider" />
          <p style="font-size:13px;color:var(--muted);margin-bottom:12px">跟读并理解文章后，点击打卡完成今日阅读。</p>
          <button class="btn btn-primary" onclick="checkIn()">✅ 我已读完，今日打卡</button>
        `;
      }
      return h;
    }

    /* ================= 朗读辅助 ================= */
    function esc(s) {
      return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
    function speakWords() {
      const c = getContentForSpeaking();
      if (c.type === 'course') playAll(c.data.words.map(w => ({fr: w[0]})), currentRate());
    }
    function speakShortSentences() {
      const c = getContentForSpeaking();
      if (c.type === 'course') playAll(c.data.shorts.map(s => ({fr: s[0]})), currentRate());
    }
    function speakLongSentences() {
      const c = getContentForSpeaking();
      if (c.type === 'course') playAll(c.data.longs.map(l => ({fr: l[0]})), currentRate());
    }
    /* 朗读时取当前显示的内容（历史回看时取历史内容） */
    function getContentForSpeaking() {
      if (viewingHistoryDate && state.checkins[viewingHistoryDate] !== undefined) {
        return getContentByIndex(state.checkins[viewingHistoryDate]);
      }
      return getTodayContent();
    }

    /* ================= 学习计时 ================= */
    let secOnPage = 0;
    setInterval(() => {
      secOnPage++;
      if (secOnPage % 60 === 0) {
        const today = todayStr();
        const m = load('minutes_' + today, 0) + 1;
        save('minutes_' + today, m);
        document.getElementById('learnMinutes').textContent = m;
      }
    }, 60000);

    /* ================= PWA 安装 ================= */
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });
    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installBanner').classList.add('hidden');
    });

    /* ================= 每日提醒（通知） ================= */
    document.getElementById('notifyBtn').addEventListener('click', async () => {
      if (!('Notification' in window)) { alert('当前浏览器不支持通知'); return; }
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        const btn = document.getElementById('notifyBtn');
        btn.textContent = '提醒已开启 ✓';
        btn.disabled = true;
        btn.classList.remove('btn-ghost');
        btn.classList.add('btn-done');
        scheduleDailyReminder();
      } else {
        alert('未授权通知，可在浏览器设置中开启');
      }
    });

    function scheduleDailyReminder() {
      const now = new Date();
      const target = new Date(now);
      target.setHours(8, 0, 0, 0);
      if (target <= now) target.setDate(target.getDate() + 1);
      const delay = target - now;
      setTimeout(() => {
        try {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('📖 新内容已准备好', { body: '今天也要坚持学法语哦，快来打卡！' });
          }
        } catch(e){}
        scheduleDailyReminder();
      }, delay);
    }

    /* ================= 云端同步（GitHub Gist） =================
     * 把打卡数据 state 存到云端 Gist，实现网页端与手机端同步。
     * 需要：
     *   1. GitHub Personal Access Token（勾选 gist 权限即可）
     *   2. 一个 Gist 的 ID（可以是任意内容）
     * 填好后既可写进下面 SYNC_CFG，也可在应用内"设置"里填写（存 localStorage）。
     * 注意：Token 写进公开页面有泄露风险，请使用仅 gist 权限的专属 Token。
     */
    const SYNC_KEY = 'francais_sync_cfg';
    const SYNC_DATA_KEY = 'francais_sync_data';
    // 可在此填入，或打开应用后在"配置"中填写
    const SYNC_DEFAULT = { token: '', gist: '' };
    let syncCfg = Object.assign({}, SYNC_DEFAULT, load(SYNC_KEY, {}));
    function saveSyncCfg(cfg) { syncCfg = cfg; save(SYNC_KEY, cfg); }

    /* 状态文本 */
    function setSyncStatus(txt) {
      const el = document.getElementById('syncStatus');
      if (el) el.textContent = txt;
    }

    /* 是否已配置 */
    function syncConfigured() { return !!(syncCfg.token && syncCfg.gist); }

    /* 读取云端数据 */
    async function gistRead() {
      const url = 'https://api.github.com/gists/' + encodeURIComponent(syncCfg.gist);
      const res = await fetch(url, {
        headers: { 'Authorization': 'token ' + syncCfg.token }
      });
      if (!res.ok) throw new Error('读取失败 HTTP ' + res.status);
      const data = await res.json();
      const files = data.files || {};
      const file = files[Object.keys(files)[0]];
      const raw = file && file.content ? file.content : '{}';
      return JSON.parse(raw);
    }

    /* 写入云端 Gist（整体覆盖） */
    async function gistWrite(obj) {
      const url = 'https://api.github.com/gists/' + encodeURIComponent(syncCfg.gist);
      const filename = 'francais-sync.json';
      const body = JSON.stringify({
        description: '法语学习打卡同步数据（TeleAgent 自动维护）',
        files: { [filename]: { content: JSON.stringify(obj) } }
      });
      const res = await fetch(url, {
        method: 'PATCH',
        headers: {
          'Authorization': 'token ' + syncCfg.token,
          'Content-Type': 'application/json'
        },
        body
      });
      if (!res.ok) throw new Error('写入失败 HTTP ' + res.status);
    }

    /* 拉取云端并合并到本地（云端较新则覆盖） */
    async function pullFromCloud() {
      if (!syncConfigured()) return;
      const cloud = await readGistSafe();
      if (!cloud || !cloud.state) return;
      const localMtime = load(SYNC_DATA_KEY, { mtime: 0 }).mtime || 0;
      const cloudMtime = cloud.mtime || 0;
      if (cloudMtime > localMtime) {
        // 云端更新：覆盖本地并保存
        const data = { state: cloud.state, mtime: cloudMtime };
        save(SYNC_DATA_KEY, data);
        state = Object.assign({}, state, cloud.state);
        save(STATE_KEY, state);
        setSyncStatus('☁️ 已同步');
      }
    }

    /* 拉取云端（失败容错） */
    async function readGistSafe() {
      try { return await gistRead(); } catch (e) { setSyncStatus('☁️ 同步失败'); return null; }
    }

    /* 推送本地到云端 */
    async function pushToCloud() {
      if (!syncConfigured()) return;
      const localM = load(SYNC_DATA_KEY, { mtime: 0 }).mtime || 0;
      const payload = { state: state, mtime: Date.now() };
      try {
        await gistWrite(payload);
        save(SYNC_DATA_KEY, { mtime: payload.mtime });
        setSyncStatus('☁️ 已同步');
      } catch (e) {
        setSyncStatus('☁️ 同步失败');
      }
    }

    /* 配置入口 */
    function onSyncBtnClick() {
      const token = prompt('请输入 GitHub Token（仅 gist 权限）：', syncCfg.token || '');
      if (token === null) return;
      const gist = prompt('请输入 Gist ID：', syncCfg.gist || '');
      if (gist === null) return;
      saveSyncCfg({ token: token.trim(), gist: gist.trim() });
      setSyncStatus('☁️ 已保存，正在同步…');
      refreshSync();
    }

    /* 刷新同步：先拉取再推送 */
    async function refreshSync() {
      if (!syncConfigured()) { setSyncStatus('☁️ 未配置'); return; }
      await pullFromCloud();
      await pushToCloud();
    }

    /* 打卡后调用，云端合并策略：本端始终推送最新 */
    function syncAfterCheckIn() {
      pushToCloud();
    }

    /* 页面加载时同步一次 */
    window.addEventListener('load', () => { setTimeout(refreshSync, 500); });

    /* ================= 注册 Service Worker ================= */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW 注册失败', e));
      });
    }

    /* 首屏渲染 */
    render();
  </script>
</body>
</html>
